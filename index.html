<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kulturverein Experience</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100vw; height: 100vh;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .hero-container {
      position: relative; width: 100vw; height: 100vh;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%),
                  url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1200') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
    }

    .hero-nav { display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .brand-logo { font-size: 0.85rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
    .nav-links { display: flex; gap: 6px; }

    .nav-item {
      color: #fff; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; padding: 6px 10px;
      background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
      border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer; transition: all 0.2s;
    }
    .nav-item:active { background: #fff; color: #000; }

    /* OVERLAY MODAL (POPUP SCHWARZ/WEISS) */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
      z-index: 100; display: none; flex-direction: column;
      justify-content: center; padding: 24px; animation: fadeIn 0.3s ease;
    }
    .overlay.active { display: flex; }

    .modal-card {
      background: #111; border: 1px solid #333; border-radius: 20px;
      padding: 24px; position: relative;
    }

    .close-btn {
      position: absolute; top: 15px; right: 20px; font-size: 1.5rem;
      color: #888; cursor: pointer;
    }

    h2 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }

    input, select {
      width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333;
      background: #000; color: #fff; margin-bottom: 12px; font-size: 0.95rem; outline: none;
    }

    .btn-action {
      width: 100%; padding: 15px; border: none; border-radius: 10px;
      background: #fff; color: #000; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px; margin-top: 10px; cursor: pointer;
    }
    .btn-action:active { background: #ccc; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="hero-nav">
      <div class="brand-logo">KULTURVEREIN</div>
      <div class="nav-links">
        <span class="nav-item" onclick="openModal('events')">Events</span>
        <span class="nav-item" onclick="openModal('galerie')">Galerie</span>
        <span class="nav-item" onclick="openModal('buchen')">Buchen</span>
        <span class="nav-item" onclick="openModal('team')">Team</span>
      </div>
    </div>
  </div>

  <!-- POPUP OVERLAY -->
  <div class="overlay" id="popup">
    <div class="modal-card">
      <span class="close-btn" onclick="closeModal()">×</span>

      <!-- INHALT DYNAMISCH -->
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function openModal(type) {
      tg.HapticFeedback.impactOccurred('medium');
      const popup = document.getElementById('popup');
      const content = document.getElementById('modal-content');

      if(type === 'buchen') {
        content.innerHTML = `
          <h2>Sitzplatz Buchen</h2>
          <input type="text" id="fullname" placeholder="Vollständiger Name">
          <select id="seats">
            <option value="1">1 Person</option>
            <option value="2">2 Personen</option>
            <option value="3">3 Personen</option>
            <option value="4">4 Personen (Familie)</option>
          </select>
          <button class="btn-action" onclick="sendBooking()">Verbindlich Reservieren</button>
        `;
      } else if(type === 'events') {
        content.innerHTML = `
          <h2>Nächstes Event</h2>
          <p style="color:#aaa; font-size:0.9rem; line-height:1.5;">
            <b>KULTURABEND 2026</b><br>
            📅 Samstag, 19:00 Uhr<br>
            📍 Hauptaula im Vereinsheim
          </p>
        `;
      } else if(type === 'galerie') {
        content.innerHTML = `
          <h2>Galerie</h2>
          <p style="color:#aaa; font-size:0.9rem;">Impressionen unserer letzten Veranstaltungen.</p>
        `;
      } else if(type === 'team') {
        content.innerHTML = `
          <h2>Vorstand & Team</h2>
          <p style="color:#aaa; font-size:0.9rem;">
            <b>Natali & Volodymyr</b><br>
            Kulturleitung und Organisation.
          </p>
        `;
      }

      popup.classList.add('active');
    }

    function closeModal() {
      document.getElementById('popup').classList.remove('active');
    }

    function sendBooking() {
      const name = document.getElementById('fullname').value.trim();
      const seats = document.getElementById('seats').value;

      if(!name) {
        tg.HapticFeedback.notificationOccurred('error');
        alert('Bitte Namen eingeben!');
        return;
      }

      tg.HapticFeedback.notificationOccurred('success');
      tg.sendData(JSON.stringify({ name: name, seats: parseInt(seats) }));
    }
  </script>
</body>
</html>
