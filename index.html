<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kulturverein</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100vw; height: 100vh; background-color: #050507; color: #fff; font-family: sans-serif; overflow: hidden; }

    .hero-container {
      position: relative; width: 100vw; height: 100vh;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(5,5,7,0.95) 100%), 
                  url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1200') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between; padding: 16px 12px;
    }

    .hero-nav { display: flex; justify-content: space-between; align-items: center; z-index: 10; width: 100%; gap: 8px; }
    .brand-logo { font-size: 1rem; font-weight: 800; letter-spacing: 1px; }
    .nav-links { display: flex; gap: 6px; width: 100%; justify-content: flex-end; }
    
    .nav-item {
      color: #fff; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; 
      padding: 7px 10px; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
      border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; white-space: nowrap;
    }

    /* Модальное окно */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
      z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center;
      padding: 12px;
    }
    .overlay.active { display: flex; }

    .modal-card {
      background: #121216; border: 1px solid #2a2a32; border-radius: 20px;
      padding: 16px; position: relative; width: 100%; max-width: 420px;
      max-height: 92vh; overflow-y: auto; display: flex; flex-direction: column;
    }
    .close-btn { position: absolute; top: 12px; right: 16px; font-size: 1.5rem; color: #888; cursor: pointer; z-index: 10; }
    h2 { font-size: 1.1rem; text-transform: uppercase; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px;}

    /* Кнопки, инпуты и прочее из старого кода сохраняем... */
    .btn-action { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #fff; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
    
    /* FAQ & INFO */
    .faq-item { margin-bottom: 12px; background: #1a1a20; padding: 12px; border-radius: 8px; }
    .faq-q { font-weight: bold; font-size: 0.85rem; color: #4dabf7; margin-bottom: 4px; }
    .faq-a { font-size: 0.8rem; color: #ccc; line-height: 1.4; }
    
    /* TEAM GRID */
    .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .team-card { background: #1a1a20; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; border: 1px solid #2a2a32; }
    .team-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; border: 2px solid #4dabf7; }
    .team-name { font-size: 0.85rem; font-weight: bold; }
    .team-role { font-size: 0.7rem; color: #888; }
    
    /* TEAM DETAIL */
    .team-detail { text-align: center; }
    .team-detail-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin: 10px auto; border: 3px solid #4dabf7; }
    .team-detail-bio { font-size: 0.85rem; color: #ccc; line-height: 1.5; margin-top: 15px; text-align: left; background: #1a1a20; padding: 12px; border-radius: 10px; }
    .back-btn { font-size: 0.8rem; color: #4dabf7; cursor: pointer; margin-bottom: 10px; display: inline-block; }

  </style>
</head>
<body>

  <div class="hero-container">
    <div class="hero-nav">
      <div class="brand-logo">KV</div>
      <div class="nav-links">
        <span class="nav-item" onclick="openModal('events')">Events</span>
        <span class="nav-item" onclick="openModal('info')">Info</span>
        <span class="nav-item" onclick="openModal('team')">Team</span>
      </div>
    </div>
  </div>

  <div class="overlay" id="popup">
    <div class="modal-card">
      <span class="close-btn" onclick="closeModal()">×</span>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Данные команды
    const teamMembers = [
      { id: 1, name: "Natali", role: "Vorstand & Orga", img: "https://i.pravatar.cc/150?img=47", bio: "Natali ist das Herz des Kulturvereins. Sie plant die Events, koordiniert das Team und sorgt dafür, dass jeder Abend unvergesslich wird." },
      { id: 2, name: "Volodymyr", role: "Künstlerische Leitung", img: "https://i.pravatar.cc/150?img=11", bio: "Volodymyr ist für das kreative Programm verantwortlich. Von der Musikauswahl bis zur Bühnengestaltung bringt er Kunst zum Leben." },
      { id: 3, name: "Anna", role: "Event Management", img: "https://i.pravatar.cc/150?img=41", bio: "Anna sorgt für einen reibungslosen Ablauf vor Ort. Sie empfängt die Gäste und koordiniert den Einlass." },
      { id: 4, name: "Max", role: "Technik & IT", img: "https://i.pravatar.cc/150?img=53", bio: "Ohne Max läuft nichts: Licht, Ton und das Buchungssystem liegen in seinen Händen. Er löst jedes technische Problem." },
      { id: 5, name: "Julia", role: "Social Media", img: "https://i.pravatar.cc/150?img=32", bio: "Julia hält unsere Community auf Instagram und Facebook auf dem Laufenden und fängt die besten Momente fotografisch ein." }
    ];

    function openModal(type) {
      tg.HapticFeedback.impactOccurred('medium');
      const popup = document.getElementById('popup');
      const content = document.getElementById('modal-content');

      if(type === 'info') {
        content.innerHTML = `
          <h2>Info & FAQ</h2>
          <div class="faq-item">
            <div class="faq-q">🤔 Wie viele Plätze kann ich buchen?</div>
            <div class="faq-a">Pro Person können maximal 4 Plätze reserviert werden.</div>
          </div>
          <div class="faq-item">
            <div class="faq-q">🎫 Wie erhalte ich mein Ticket?</div>
            <div class="faq-a">Sobald der Vorstand die Buchung bestätigt, schickt der Bot dir einen QR-Code direkt in den Chat.</div>
          </div>
          <div class="faq-item">
            <div class="faq-q">❌ Kann ich stornieren?</div>
            <div class="faq-a">Ja, klicke im Chatmenü auf "Reservierung stornieren".</div>
          </div>
          <div style="margin-top:20px; text-align:center; padding: 15px; background: rgba(0, 123, 255, 0.1); border-radius:10px;">
            <div style="font-weight:bold; margin-bottom: 8px;">Fragen oder Probleme?</div>
            <p style="font-size:0.8rem; color:#aaa; margin-bottom: 12px;">Schreibe dein Anliegen einfach als Textnachricht hier in den Telegram-Chat. Das Team antwortet dir direkt!</p>
            <button class="btn-action" onclick="tg.close()">Schließen & Chat öffnen</button>
          </div>
        `;
      } 
      else if(type === 'team') {
        let gridHtml = '<div class="team-grid">';
        teamMembers.forEach(m => {
          gridHtml += `
            <div class="team-card" onclick="showTeamMember(${m.id})">
              <img src="${m.img}" class="team-img">
              <div class="team-name">${m.name}</div>
              <div class="team-role">${m.role}</div>
            </div>`;
        });
        gridHtml += '</div>';
        content.innerHTML = `<h2>Unser Team</h2>${gridHtml}`;
      }
      popup.classList.add('active');
    }

    function showTeamMember(id) {
      tg.HapticFeedback.selectionChanged();
      const member = teamMembers.find(m => m.id === id);
      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <div class="back-btn" onclick="openModal('team')">⬅ Zurück zur Übersicht</div>
        <div class="team-detail">
          <img src="${member.img}" class="team-detail-img">
          <h2>${member.name}</h2>
          <div style="color:#4dabf7; font-size:0.9rem;">${member.role}</div>
          <div class="team-detail-bio">${member.bio}</div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('popup').classList.remove('active');
    }
  </script>
</body>
</html>
