<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kulturverein Experience</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100vw; height: 100vh;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .hero-container {
      position: relative; width: 100vw; height: 100vh;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%),
                  url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1200') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px 12px;
    }

    .hero-nav { display: flex; justify-content: space-between; align-items: center; z-index: 10; width: 100%; gap: 10px; }
    .brand-logo { font-size: clamp(0.75rem, 3vw, 0.95rem); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
    .nav-links { display: flex; gap: 6px; width: 100%; justify-content: flex-end; }

    .nav-item {
      color: #fff; font-size: clamp(0.6rem, 2.4vw, 0.8rem); font-weight: 700; text-transform: uppercase;
      padding: 7px 0; text-align: center; flex: 1; max-width: 90px;
      background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .nav-item:active { background: #fff; color: #000; }

    /* OVERLAY MODAL */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      z-index: 100; display: none; flex-direction: column; justify-content: center; padding: 16px; animation: fadeIn 0.3s ease;
    }
    .overlay.active { display: flex; }

    .modal-card {
      background: #111; border: 1px solid #333; border-radius: 20px;
      padding: 20px; position: relative; max-height: 90vh; overflow-y: auto;
    }

    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: #888; cursor: pointer; }
    h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    /* EVENT CARD */
    .event-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .event-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 6px; color: #fff; }
    .event-info { font-size: 0.8rem; color: #aaa; margin-bottom: 10px; line-height: 1.4; }

    /* BÜHNE & SAALPLAN (8 REIHEN x 10 STÜHLE) */
    .stage {
      width: 100%; background: #333; color: #888; text-align: center;
      padding: 4px; font-size: 0.65rem; font-weight: bold; letter-spacing: 2px;
      border-radius: 4px; margin-bottom: 15px; text-transform: uppercase;
    }

    .seating-grid {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px;
      max-height: 40vh; overflow-x: auto; overflow-y: auto; padding: 4px;
    }

    .seat-row { display: flex; align-items: center; justify-content: center; gap: 4px; }
    .row-label { font-size: 0.65rem; color: #666; width: 20px; text-align: right; margin-right: 4px; font-weight: bold; }

    .seat {
      width: 22px; height: 22px; border-radius: 6px; background: #222; border: 1px solid #444;
      color: #fff; font-size: 0.6rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; transition: all 0.2s;
    }

    .seat.selected { background: #fff; color: #000; border-color: #fff; font-weight: bold; }
    .seat.occupied { background: #300; border-color: #500; color: #555; cursor: not-allowed; }

    input {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333;
      background: #000; color: #fff; margin-bottom: 10px; font-size: 0.9rem; outline: none;
    }

    .btn-action {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #fff; color: #000; font-weight: bold; text-transform: uppercase;
      font-size: 0.75rem; letter-spacing: 1px; cursor: pointer;
    }
    .btn-action:active { background: #ccc; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="hero-nav">
      <div class="brand-logo">KULTURVEREIN</div>
      <div class="nav-links">
        <span class="nav-item" onclick="openModal('events')">Events</span>
        <span class="nav-item" onclick="openModal('galerie')">Galerie</span>
        <span class="nav-item" onclick="openModal('team')">Team</span>
      </div>
    </div>
  </div>

  <div class="overlay" id="popup">
    <div class="modal-card">
      <span class="close-btn" onclick="closeModal()">×</span>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let selectedSeats = [];

    const eventsList = [
      {
        id: "kulturabend_2026",
        title: "Kulturabend 2026",
        date: "Samstag, 19:00 Uhr",
        location: "Hauptaula im Vereinsheim",
        description: "Ein unvergesslicher Abend voller Musik und Kunst."
      }
    ];

    function openModal(type) {
      tg.HapticFeedback.impactOccurred('medium');
      const popup = document.getElementById('popup');
      const content = document.getElementById('modal-content');

      if(type === 'events') {
        let html = `<h2>Anstehende Events</h2>`;
        eventsList.forEach(event => {
          html += `
            <div class="event-card">
              <div class="event-title">${event.title}</div>
              <div class="event-info">📅 ${event.date} | 📍 ${event.location}</div>
              <button class="btn-action" onclick="openSeatingPlan('${event.title}')">Sitzplätze Auswählen</button>
            </div>
          `;
        });
        content.innerHTML = html;
      } else if(type === 'galerie') {
        content.innerHTML = `<h2>Galerie</h2><p style="color:#aaa; font-size:0.85rem;">Eindrücke unserer Events.</p>`;
      } else if(type === 'team') {
        content.innerHTML = `<h2>Team</h2><p style="color:#aaa; font-size:0.85rem;">Natali & Volodymyr</p>`;
      }
      popup.classList.add('active');
    }

    function openSeatingPlan(eventTitle) {
      tg.HapticFeedback.impactOccurred('light');
      selectedSeats = [];
      const content = document.getElementById('modal-content');

      // Erzeuge 8 Reihen x 10 Stühle Grid
      let gridHtml = `<div class="stage">BÜHNE / LEINWAND</div><div class="seating-grid">`;

      for (let r = 1; r <= 8; r++) {
        gridHtml += `<div class="seat-row"><span class="row-label">R${r}</span>`;
        for (let s = 1; s <= 10; s++) {
          const seatId = `R${r}-S${s}`;
          gridHtml += `<div class="seat" id="seat-${seatId}" onclick="toggleSeat('${seatId}')">${s}</div>`;
        }
        gridHtml += `</div>`;
      }
      gridHtml += `</div>`;

      content.innerHTML = `
        <h2>Platzwahl</h2>
        <p style="color:#888; font-size:0.75rem; margin-bottom:8px;">Wähle deine Stühle für: <b>${eventTitle}</b></p>
        ${gridHtml}
        <input type="hidden" id="event_name" value="${eventTitle}">
        <input type="text" id="fullname" placeholder="Vollständiger Name">
        <button class="btn-action" onclick="sendBooking()">
          <span id="seat-count-text">0 Stühle ausgewählt</span> – Reservieren
        </button>
      `;
    }

    function toggleSeat(seatId) {
      tg.HapticFeedback.selectionChanged();
      const seatEl = document.getElementById(`seat-${seatId}`);

      if (selectedSeats.includes(seatId)) {
        selectedSeats = selectedSeats.filter(id => id !== seatId);
        seatEl.classList.remove('selected');
      } else {
        if (selectedSeats.length >= 4) {
          alert("Maximal 4 Stühle pro Buchung erlaubt!");
          return;
        }
        selectedSeats.push(seatId);
        seatEl.classList.add('selected');
      }

      document.getElementById('seat-count-text').innerText = `${selectedSeats.length} Stuhl/Stühle ausgewählt`;
    }

    function closeModal() {
      document.getElementById('popup').classList.remove('active');
    }

    function sendBooking() {
      const name = document.getElementById('fullname').value.trim();
      const eventName = document.getElementById('event_name').value;
      const user = tg.initDataUnsafe.user;
      const userId = user ? user.id : "Unbekannt";

      if(!name) {
        tg.HapticFeedback.notificationOccurred('error');
        alert('Bitte Namen eingeben!');
        return;
      }

      if(selectedSeats.length === 0) {
        tg.HapticFeedback.notificationOccurred('error');
        alert('Bitte wähle mindestens 1 Stuhl aus!');
        return;
      }

      tg.HapticFeedback.notificationOccurred('success');

      // Sende ausgewählte Stühle an Python
      tg.sendData(JSON.stringify({
        telegram_id: userId,
        event: eventName,
        name: name,
        seats: selectedSeats // Z.B. ["R1-S4", "R1-S5"]
      }));
    }
  </script>
</body>
</html>
