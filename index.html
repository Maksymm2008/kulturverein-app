<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kulturverein Experience</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100vw; height: 100vh;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .hero-container {
      position: relative; width: 100vw; height: 100vh;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%),
                  url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1200') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px 12px;
    }

    /* NAVIGATION (JETZT NUR NOCH 3 BUTTONS = PERFEKTER PLATZ) */
    .hero-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      width: 100%;
      gap: 10px;
    }

    .brand-logo {
      font-size: clamp(0.75rem, 3vw, 0.95rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: flex-end;
    }

    .nav-item {
      color: #fff;
      font-size: clamp(0.6rem, 2.4vw, 0.8rem);
      font-weight: 700;
      text-transform: uppercase;
      padding: 7px 0;
      text-align: center;
      flex: 1;
      max-width: 90px;

      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .nav-item:active { background: #fff; color: #000; }

    /* OVERLAY MODAL */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 100; display: none; flex-direction: column;
      justify-content: center; padding: 20px; animation: fadeIn 0.3s ease;
    }
    .overlay.active { display: flex; }

    .modal-card {
      background: #111; border: 1px solid #333; border-radius: 20px;
      padding: 24px; position: relative; max-height: 85vh; overflow-y: auto;
    }

    .close-btn {
      position: absolute; top: 15px; right: 20px; font-size: 1.5rem;
      color: #888; cursor: pointer;
    }

    h2 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }

    /* EVENT CARD STYLING */
    .event-card {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
      padding: 16px; margin-bottom: 14px;
    }
    .event-title { font-size: 1rem; font-weight: bold; margin-bottom: 6px; color: #fff; }
    .event-info { font-size: 0.8rem; color: #aaa; margin-bottom: 12px; line-height: 1.4; }

    input, select {
      width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333;
      background: #000; color: #fff; margin-bottom: 12px; font-size: 0.95rem; outline: none;
    }

    .btn-action {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #fff; color: #000; font-weight: bold; text-transform: uppercase;
      font-size: 0.75rem; letter-spacing: 1px; cursor: pointer; transition: background 0.2s;
    }
    .btn-action:active { background: #ccc; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="hero-nav">
      <div class="brand-logo">KULTURVEREIN</div>
      <div class="nav-links">
        <span class="nav-item" onclick="openModal('events')">Events</span>
        <span class="nav-item" onclick="openModal('galerie')">Galerie</span>
        <span class="nav-item" onclick="openModal('team')">Team</span>
      </div>
    </div>
  </div>

  <!-- POPUP OVERLAY -->
  <div class="overlay" id="popup">
    <div class="modal-card">
      <span class="close-btn" onclick="closeModal()">×</span>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Event-Datenbank (hier kannst du jederzeit neue Events hinzufügen)
    const eventsList = [
      {
        id: "kulturabend_2026",
        title: "Kulturabend 2026",
        date: "Samstag, 19:00 Uhr",
        location: "Hauptaula im Vereinsheim",
        description: "Ein unvergesslicher Abend voller Musik, Kunst und Begegnungen."
      },
      {
        id: "herbstfest",
        title: "Klassik & Jazz Konzert",
        date: "24. Oktober, 18:00 Uhr",
        location: "Großer Saal",
        description: "Live-Performance unserer Vereinsmitglieder und Gastmusiker."
      }
    ];

    function openModal(type) {
      tg.HapticFeedback.impactOccurred('medium');
      const popup = document.getElementById('popup');
      const content = document.getElementById('modal-content');

      if(type === 'events') {
        let html = `<h2>Anstehende Events</h2>`;

        eventsList.forEach(event => {
          html += `
            <div class="event-card">
              <div class="event-title">${event.title}</div>
              <div class="event-info">
                📅 ${event.date}<br>
                📍 ${event.location}<br><br>
                ${event.description}
              </div>
              <button class="btn-action" onclick="openBookingForm('${event.title}')">Plätze Reservieren</button>
            </div>
          `;
        });
        content.innerHTML = html;

      } else if(type === 'galerie') {
        content.innerHTML = `
          <h2>Galerie</h2>
          <p style="color:#aaa; font-size:0.9rem;">Impressionen unserer letzten Veranstaltungen.</p>
        `;
      } else if(type === 'team') {
        content.innerHTML = `
          <h2>Vorstand & Team</h2>
          <p style="color:#aaa; font-size:0.9rem;">
            <b>Natali & Volodymyr</b><br>
            Kulturleitung und Organisation.
          </p>
        `;
      }

      popup.classList.add('active');
    }

    function openBookingForm(eventTitle) {
      tg.HapticFeedback.impactOccurred('light');
      const content = document.getElementById('modal-content');

      content.innerHTML = `
        <h2>Buchung</h2>
        <p style="color:#888; font-size:0.85rem; margin-bottom:12px;">Event: <b style="color:#fff;">${eventTitle}</b></p>

        <input type="hidden" id="event_name" value="${eventTitle}">
        <input type="text" id="fullname" placeholder="Vollständiger Name">
        <select id="seats">
          <option value="1">1 Person</option>
          <option value="2">2 Personen</option>
          <option value="3">3 Personen</option>
          <option value="4">4 Personen (Familie)</option>
        </select>
        <button class="btn-action" onclick="sendBooking()">Verbindlich Reservieren</button>
      `;
    }

    function closeModal() {
      document.getElementById('popup').classList.remove('active');
    }

    function sendBooking() {
      const name = document.getElementById('fullname').value.trim();
      const seats = document.getElementById('seats').value;
      const eventName = document.getElementById('event_name').value;

      const user = tg.initDataUnsafe.user;
      const userId = user ? user.id : "Unbekannt";

      if(!name) {
        tg.HapticFeedback.notificationOccurred('error');
        alert('Bitte Namen eingeben!');
        return;
      }

      tg.HapticFeedback.notificationOccurred('success');

      // Daten inklusive Event-Name an Python schicken
      tg.sendData(JSON.stringify({
        telegram_id: userId,
        event: eventName,
        name: name,
        seats: parseInt(seats)
      }));
    }
  </script>
</body>
</html>
